[project]
name = "variometer"
version = "0.1.0"
description = "Variometer — multi-year cash-flow and net-worth planning for tech workers with equity comp"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Carroll" }]
keywords = [
    "financial-planning",
    "cash-flow",
    "net-worth",
    "rsu",
    "equity-compensation",
    "tax",
    "retirement",
    "fire",
    "monte-carlo",
    "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pandas>=2.0",            # tabular output / snapshots
    "streamlit>=1.35",        # UI
    "plotly>=5.20",           # charts
]

[project.scripts]
# One console script, three commands, all dispatched from variometer.cli:main:
#   variometer            configuration status + command reference (no dollar
#                         figures — safe to run on a screen share)
#   variometer explain …  the scenario explainer
#   variometer ui         the Streamlit app
variometer = "variometer.cli:main"

[project.urls]
Homepage = "https://github.com/JoshuaC215/variometer"
Repository = "https://github.com/JoshuaC215/variometer"
Issues = "https://github.com/JoshuaC215/variometer/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["variometer"]

[tool.hatch.build.targets.sdist]
# The sdist is the *package*, not the repo. Tests, docs, examples, ad_hoc/ and
# scripts/ stay in git; shipping them would also risk dragging the gitignored
# user_data/ private layer into a published artifact.
include = [
    "/variometer",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
# NOTE: hatchling force-includes .gitignore in every sdist (it is a VCS
# exclusion file, and force_include bypasses `include`/`exclude`). The only way
# to drop it is `ignore-vcs = true`, which would ALSO stop .gitignore from
# excluding files from the build — i.e. it would remove the backstop keeping the
# gitignored user_data/ private layer out of published artifacts. Not worth it
# for a 500-byte file of ignore patterns; the safety net stays.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic ruleset. Add rules over time, don't try to boil the ocean.
#   E,W  pycodestyle errors + warnings (mostly whitespace / style)
#   F    pyflakes (unused imports, undefined names, real bugs)
#   I    isort (consistent import order)
#   UP   pyupgrade (modern Python idioms)
#   B    flake8-bugbear (likely-bug patterns)
select = ["E", "W", "F", "I", "UP", "B"]
# Allow the dense column-aligned Annotated declarations in scenarios.py and
# similar tabular literals to exceed line length without being reformatted.
ignore = [
    "E501",   # line too long — column-aligned scenario factories deliberately overflow
    "E701",   # multiple statements on one line — `if x: y = z` is fine
    "E741",   # ambiguous variable name (e.g. `l` for "left") — pragmatic
    "B017",   # blind `Exception` in test_events.py is intentional (dataclass frozen test)
]

[tool.uv]
# eMudhra/emSign CA incident (Oct 2026): older uv builds and certifi bundles
# still trust the revoked emSign root. Refuse to run with an affected uv, and
# never lock certifi (pulled in transitively via requests) below the fix.
required-version = ">=0.13.4"
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.ruff.lint.per-file-ignores]
# Tests can have long parametrize tables, fixture-style imports, etc.
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
# scenarios.py uses deliberate column alignment on the `Annotated[..., Knob(...)]`
# parameter lists so factories read like a config table. `ruff format` would
# break the alignment, so we skip it here. `ruff check` still applies.
exclude = ["variometer/scenarios.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
